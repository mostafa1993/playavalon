# docker-compose.yml — unified prod + local-test stack.
#
# Modes:
#   docker compose up
#     Local-test mode: app + livekit + redis, accessible on http://localhost:3000.
#     Uses ${ENV_FILE:-.env.local} for the app's runtime envs.
#
#   docker compose --profile prod up
#     Full prod: adds traefik (TLS/routing for playavalon.fun) + agent (AI reviewer).
#     Set ENV_FILE=.env (and ACME_EMAIL, NEXT_PUBLIC_SUPABASE_*, LIVEKIT_API_*) in your
#     shell or .env file. You can also set COMPOSE_PROFILES=prod to skip the --profile
#     flag on every invocation.
#
# Note: docker-compose-dev.yml is separate — it runs LiveKit alone for use alongside
# `npm run dev` on the host.

services:
  traefik:
    profiles: [prod]
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - default
      - avalon-shared
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file: ${ENV_FILE:-.env.local}
    depends_on:
      - redis
      - livekit
    ports:
      # Bind to 127.0.0.1 so the port is reachable on the host (local mode + VM
      # debugging) without exposing the non-TLS port externally in prod — traefik
      # still routes externals via the docker network.
      - "127.0.0.1:3000:3000"
    volumes:
      # Read-only mount of the agent's data so the review API can serve summary files.
      - game_reviews_data:/data/games:ro
    # GCP can't hairpin the VM's own public IP, so resolve the Supabase subdomain to
    # the host (→ Traefik → Kong). Server-side calls stay on the box; browser still
    # uses the real public DNS. Keeps NEXT_PUBLIC_SUPABASE_URL identical everywhere.
    extra_hosts:
      - "supabase.playavalon.fun:host-gateway"
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`playavalon.fun`)
      - traefik.http.routers.app.tls.certresolver=letsencrypt
      - traefik.http.services.app.loadbalancer.server.port=3000
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    network_mode: host
    volumes:
      - ${LIVEKIT_CONFIG:-./livekit-dev.yaml}:/etc/livekit.yaml
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      # Bind to 127.0.0.1 so redis-cli works from the host without externally
      # exposing redis in prod.
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  reviewer:
    profiles: [prod]
    build:
      # Workspace root, so the image can see the @avalon/shared package.
      context: ./agents
      dockerfile: reviewer/Dockerfile
    env_file: ${ENV_FILE:-.env.local}
    environment:
      # Agent talks to LiveKit on the same host — skip Traefik/TLS, which
      # would otherwise trip rustls cert validation in @livekit/rtc-node.
      LIVEKIT_URL: ws://host.docker.internal:7880
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - game_reviews_data:/data/games
      - ./agents/reviewer/prompts:/app/reviewer/prompts:ro
      - ./secrets/vertex-sa.json:/run/secrets/vertex-sa.json:ro
    depends_on:
      - livekit
    # Give endSession time to finish its LLM calls on SIGTERM before
    # Docker sends SIGKILL (default 10s is too short for Vertex calls).
    stop_grace_period: 120s
    restart: unless-stopped

  # Feature 024 (P4): bot supervisor — watches for rooms with agent_count > 0
  # and spawns one agent process per bot seat. Agents play full games via the
  # public HTTP API. Only meaningful in production (where humans are creating
  # rooms); for local testing, devs run cli/run.ts or cli/populate.ts directly.
  bot-supervisor:
    profiles: [prod]
    build:
      # Workspace root, so the image can see the @avalon/shared package.
      context: ./agents
      dockerfile: bot-supervisor/Dockerfile
    env_file: ${ENV_FILE:-.env.local}
    environment:
      # Override the agent's default base_url to talk to the in-network app
      # service rather than the public URL. Saves the round-trip through
      # traefik+TLS for every poll.
      AGENT_BASE_URL: http://app:3000
      AGENTS_CONFIGS_DIR: /app/configs
    volumes:
      # Live-mount configs + prompts from the repo so edits don't need a rebuild.
      - ./agents/bot-supervisor/configs:/app/configs:ro
      - ./agents/bot-supervisor/prompts:/app/bot-supervisor/prompts:ro
      # mode: smart calls Gemini — same service account the reviewer uses.
      - ./secrets/vertex-sa.json:/run/secrets/vertex-sa.json:ro
    extra_hosts:
      # Same GCP hairpin workaround as the app — bots sign in to Supabase by the
      # public URL, which must resolve to the host (→ Traefik → Kong) on the VM.
      - "supabase.playavalon.fun:host-gateway"
    depends_on:
      - app
    restart: unless-stopped
    # Spawned child agents may be in active games; give them time to wrap
    # cleanly on SIGTERM (game_over detection + quiz vote) before SIGKILL.
    stop_grace_period: 60s

  # Daily keepalive — hits /api/cleanup so Supabase sees activity and doesn't
  # auto-pause after 7 days of idle (free tier). The endpoint also archives
  # stale rooms, so this doubles as the room-cleanup cron.
  # Requires CLEANUP_API_KEY in .env (any random string; also referenced by
  # src/app/api/cleanup/route.ts).
  cleanup-cron:
    profiles: [prod]
    image: alpine:3.19
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CLEANUP_API_KEY: ${CLEANUP_API_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl >/dev/null
        while true; do
          curl -fsS -H "x-api-key: $$CLEANUP_API_KEY" http://app:3000/api/cleanup > /dev/null \
            && echo "[$$(date -u +%FT%TZ)] cleanup keepalive ok" \
            || echo "[$$(date -u +%FT%TZ)] cleanup keepalive FAILED"
          sleep 86400
        done

networks:
  # Shared with the self-hosted Supabase stack so Traefik can route to Kong.
  # Create once on the VM: docker network create avalon-shared
  avalon-shared:
    external: true

volumes:
  letsencrypt:
  redis_data:
  game_reviews_data:
