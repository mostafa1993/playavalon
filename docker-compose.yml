# docker-compose.yml — unified prod + local-test stack.
#
# Modes:
#   docker compose up
#     Local-test mode: app + livekit + redis, accessible on http://localhost:3000.
#     Uses ${ENV_FILE:-.env.local} for the app's runtime envs.
#
#   docker compose --profile prod up
#     Full prod: adds traefik (TLS/routing for playavalon.fun) + agent (AI reviewer).
#     Set ENV_FILE=.env (and ACME_EMAIL, NEXT_PUBLIC_SUPABASE_*, LIVEKIT_API_*) in your
#     shell or .env file. You can also set COMPOSE_PROFILES=prod to skip the --profile
#     flag on every invocation.
#
# Note: docker-compose-dev.yml is separate — it runs LiveKit alone for use alongside
# `npm run dev` on the host.

services:
  traefik:
    profiles: [prod]
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file: ${ENV_FILE:-.env.local}
    depends_on:
      - redis
      - livekit
    ports:
      # Bind to 127.0.0.1 so the port is reachable on the host (local mode + VM
      # debugging) without exposing the non-TLS port externally in prod — traefik
      # still routes externals via the docker network.
      - "127.0.0.1:3000:3000"
    volumes:
      # Read-only mount of the agent's data so the review API can serve summary files.
      - game_reviews_data:/data/games:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`playavalon.fun`)
      - traefik.http.routers.app.tls.certresolver=letsencrypt
      - traefik.http.services.app.loadbalancer.server.port=3000
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    network_mode: host
    volumes:
      - ${LIVEKIT_CONFIG:-./livekit-dev.yaml}:/etc/livekit.yaml
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      # Bind to 127.0.0.1 so redis-cli works from the host without externally
      # exposing redis in prod.
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  agent:
    profiles: [prod]
    build:
      context: ./agent
    env_file: ${ENV_FILE:-.env.local}
    environment:
      # Agent talks to LiveKit on the same host — skip Traefik/TLS, which
      # would otherwise trip rustls cert validation in @livekit/rtc-node.
      LIVEKIT_URL: ws://host.docker.internal:7880
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - game_reviews_data:/data/games
      - ./agent/prompts:/app/prompts:ro
      - ./secrets/vertex-sa.json:/run/secrets/vertex-sa.json:ro
    depends_on:
      - livekit
    # Give endSession time to finish its LLM calls on SIGTERM before
    # Docker sends SIGKILL (default 10s is too short for Vertex calls).
    stop_grace_period: 120s
    restart: unless-stopped

volumes:
  letsencrypt:
  redis_data:
  game_reviews_data:
