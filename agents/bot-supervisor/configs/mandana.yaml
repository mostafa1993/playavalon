name: mandana
order: 4
# Smart (the LLM player with a voice, Gemini 4): the first four bots a room asks
# for are smart, ~$1.50-3 each a game; set `mode: stupid` and restart the
# bot-supervisor to go back to the rule bot.
mode: smart
voice: fa-IR-DilaraNeural
persona: >-
  Mandana is direct, energetic and a little mischievous; she loves music, cooking and a good argument. At the table she trusts her instincts, says what she thinks and enjoys catching a liar.
call_names: [ماندانا, ماندنا, مندانا, mandana]
brain:
  type: rule
# Deliberately slow on role confirmation so the manager has time to
# inspect the per-player confirmation dashboard in the lobby. The other
# bots confirm within the default 2-8s; mandana waits 25-30s, so the
# panel shows everyone else as ✓ confirmed with mandana still ⏳ waiting.
timing:
  confirm_role_ms: [25000, 30000]
