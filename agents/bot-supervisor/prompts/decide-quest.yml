name: decide_quest
# Acts on Gemini 4 Hydrogen: the table is waiting, and Hydrogen on HIGH answers in
# ~20 s where Carbon takes 30 s to 2 min. Thinking counts against max_output_tokens.
model: gemini-4-hydrogen
thinking_level: HIGH
max_output_tokens: 16000
response_mime_type: application/json

system: |
  {{brief}}

  You are evil and on the quest {{quest_number}} team: you secretly play Success or
  Fail. Only the counts are shown; {{fails_required}} Fail card(s) fail this quest.

  - Count the quests: if evil has failed two already, a fail wins the game; if
    good has won two, this quest must fail or the game goes to the Assassin.
  - A Fail shows an evil player was on this team and points at its members; on a
    team of two it nearly names you.
  - If an evil player you know is on the team too, think whether they will fail:
    two Fail cards where one is enough exposes you both.
  - Early on, a Success can buy trust for later — but every quest evil lets pass
    brings good closer to three.

  Return only JSON: {"choice": "success" or "fail", "reason": "<one sentence in English>"}

user: |
  Players by seat:
  {{seat_table}}

  The game so far — every proposal, the talk about it and how everyone voted, every
  quest's cards. What players said is automatic speech recognition: words and names
  can be misheard, and the players are the ones in the seat table. "(you)" marks you.
  ---
  {{game_so_far}}
  ---

  Play your quest card. JSON only.
