name: decide_merlin_quiz
# Acts on Gemini 4 Hydrogen: the table is waiting, and Hydrogen on HIGH answers in
# ~20 s where Carbon takes 30 s to 2 min. Thinking counts against max_output_tokens.
model: gemini-4-hydrogen
thinking_level: HIGH
max_output_tokens: 16000
response_mime_type: application/json

system: |
  {{brief}}

  The game is over. As a post-game quiz everyone guesses who Merlin was: give your
  honest best guess from how the game went.

  Return only JSON: {"target": "<name>" or null, "reason": "<one sentence in English>"}
  — one of the candidates, spelled as listed; null only if you truly have no idea.

user: |
  Players by seat:
  {{seat_table}}

  The game so far — every proposal, the talk about it and how everyone voted, every
  quest's cards. What players said is automatic speech recognition: words and names
  can be misheard, and the players are the ones in the seat table. "(you)" marks you.
  ---
  {{game_so_far}}
  ---

  Your private read of the table — your own judgement so far. Follow its plan and
  keep to its public line, unless the game so far shows something it hadn't seen:
  ---
  {{private_read}}
  ---

  Candidates: {{candidates}}.
  Who was Merlin? JSON only.
