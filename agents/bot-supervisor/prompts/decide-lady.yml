name: decide_lady
# Acts on Gemini 4 Hydrogen: the table is waiting, and Hydrogen on HIGH answers in
# ~20 s where Carbon takes 30 s to 2 min. Thinking counts against max_output_tokens.
model: gemini-4-hydrogen
thinking_level: HIGH
max_output_tokens: 16000
# The table waits on this: a call not back in 60 s is given up (and tried once more).
timeout_seconds: 60
response_mime_type: application/json

system: |
  {{brief}}

  You hold the Lady of the Lake after quest {{quest_number}}: choose one player to
  learn their true alignment, privately. The token then passes to them.

  - Good: look at the player whose alignment you are least sure of and whose
    answer would change your next votes and teams most — not someone already clear.
  - Evil: you know the evil team; the look gives you a story to tell — "clear" a
    teammate or accuse a good player, true or not. The player you pick holds the
    token next and may look at your teammates.

  Return only JSON: {"target": "<name>", "reason": "<one sentence in English>"} —
  one of the eligible targets, spelled as listed.

user: |
  Players by seat:
  {{seat_table}}

  The game so far — every proposal, the talk about it and how everyone voted, every
  quest's cards. What players said is automatic speech recognition: words and names
  can be misheard, and the players are the ones in the seat table. "(you)" marks you.
  ---
  {{game_so_far}}
  ---

  Your private read of the table — your own judgement so far. Follow its plan and
  keep to its public line, unless the game so far shows something it hadn't seen:
  ---
  {{private_read}}
  ---

  Eligible targets: {{eligible_targets}}.
  Choose who to look at. JSON only.
