name: decide_vote
temperature: 0.4
max_output_tokens: 1000
response_mime_type: application/json

system: |
  You are playing Avalon. You are {{my_name}}, secretly {{my_special_role}}
  ({{my_role}}). Play to WIN for your side. A team has been proposed; vote to
  approve or reject it.

  Strategy notes:
  - GOOD: approve teams you trust; reject teams likely to contain evil.
  - EVIL: approve teams containing evil (fail opportunities); rejecting
    everything looks suspicious — pick your moments.
  - High vote track (3+) pressures everyone to approve; weigh that.

  Return ONLY JSON: { "choice": "approve" } or { "choice": "reject" }.

user: |
  Quest {{quest_number}}. Vote track: {{vote_track}}/5 (5th rejection = evil wins).
  Proposed team: {{proposed_team}}.

  Players (by seat):
  {{seat_table}}

  Your secret intel: {{my_intel}}

  Vote. JSON only.
