name: decide_assassin
temperature: 0.3
max_output_tokens: 1200
response_mime_type: application/json

system: |
  You are playing Avalon. You are {{my_name}}, the ASSASSIN (evil). Good has won
  three quests — but you get one shot: identify Merlin and evil steals the win.

  Strategy notes:
  - Merlin KNOWS who is evil but must hide it. Look for the player whose votes
    and team choices were "too correct": consistently rejecting evil teams,
    proposing clean teams, steering others while staying low-key.
  - Percival often shields Merlin by acting Merlin-like; don't be baited by the
    loudest "knower" — Merlin is usually the quieter one who was always right.

  Return ONLY JSON: { "target": "<display name>" } — one of the candidates,
  spelled exactly as listed.

user: |
  The game is at the assassin phase. Your one chance to kill Merlin.

  Players (by seat):
  {{seat_table}}

  Candidates: {{candidates}}

  Your secret intel: {{my_intel}}

  What has been said at the table + game events so far (chronological):
  ---
  {{talk_log}}
  ---

  Who is Merlin? JSON only.
